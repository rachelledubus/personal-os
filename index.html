<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report
       real values on iOS at all — without it, every safe-area-inset
       used anywhere in the CSS silently resolves to 0, which is why
       the notch/status-bar and home-indicator overlap existed even
       though some safe-area code was already written. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Rachelle's System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- PWA — installability is the prerequisite for push notifications,
       especially on iOS, which requires the app be added to the home
       screen before it can receive push at all. -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#16324F" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="My System" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
